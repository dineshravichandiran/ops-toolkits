# example-httpd.conf - a generic, fully policy-compliant Apache config
# for a web application server. No real hostnames, paths, or company
# names -- adjust before use against a real host.

ServerRoot "/etc/httpd"
Listen 80

ServerTokens Prod
ServerSignature Off
Timeout 60

DocumentRoot "/var/www/html"

<Directory "/var/www/html">
    Options -Indexes -Includes
    AllowOverride None
    Require all granted
</Directory>

<Location "/server-status">
    SetHandler server-status
    Require local
</Location>

<Location "/server-info">
    SetHandler server-info
    Require local
</Location>

ErrorLog "/var/log/httpd/error_log"
CustomLog "/var/log/httpd/access_log" combined
